# @package _global_
algorithm:
  checkpoint:
    strict: true
    weights_source: raw
    reset_training_state: true
  alignment:
    alignment_mode: unit_world_latent
    unit_arch_version: 7
    unit_inference_enable: true
    unit_video_only_inference: false
    unit_migrate_from_version: null
    unit_full_teacher_checkpoint: checkpoints/upcast_unified.ckpt
    unit_allow_curriculum_override: true
    alignment_coeff: 0.008
    unit_geometry_tokenizer_steps: 0
    unit_bootstrap_steps: 0
    unit_joint_ramp_steps: 25
    unit_joint_alignment_coeff: 0.008
    unit_freeze_after_bootstrap: true
    unit_cotrain_start_step: -1
    world_state_training_mode: selective_joint
    selective_diffusion_trainable_prefixes:
    - model.external_cond_embedding
    - model.down_blocks.1
    - model.down_blocks.2
    - model.mid_blocks.8
    - model.mid_blocks.9
    - model.mid_blocks.10
    - model.mid_blocks.11
    - model.up_blocks.0
    - model.up_blocks.1
    - model.project_output
    - model.world_state_adapter
    world_state_runtime_scale: 1.0
    world_state_lr: 5.0e-06
    alignment_context_length: 16
    keyframe_stride: 1
    latents_info:
    - - 576
      - 32
      - 32
    geometry_teacher_checkpoint: huggingface/zhouk777--PAGE4D/checkpoint_nomask.pt
    unit_video_tail_checkpoint: checkpoints/DFoT_16f_state_dict.ckpt
    unit_joint_visual_loss_weight: 0.1
    unit_joint_geometry_loss_weight: 0.25
    unit_joint_tail_fm_loss_weight: 1.0
    unit_joint_rvq_loss_weight: 0.1
    unit_joint_code_assignment_loss_weight: 0.05
    unit_joint_soft_code_loss_weight: 0.05
    unit_joint_pre_vq_alignment_loss_weight: 0.02
    unit_joint_physical_contrast_loss_weight: 0.02
    unit_joint_appearance_contrast_loss_weight: 0.01
    unit_joint_world_state_distill_loss_weight: 0.1
    compute_generation_loss: true
    generation_loss_freq: 10
    generation_loss_phase: 0
    generation_loss_frequency_compensation: true
    strict_generation_protection: true
    generation_dino_patch_loss_weight: 0.004
    generation_vjepa_spatial_loss_weight: 0.001
    generation_vjepa_temporal_loss_weight: 0.015
    generation_vjepa_global_loss_weight: 0.0005
    generation_color_moment_loss_weight: 0.001
    generation_rgb_temporal_loss_weight: 0.002
    generation_noise_signal_threshold: 0.1
    video_prior_preservation_weight: 0.05
    video_prior_checkpoint: checkpoints/upcast_adapter.ckpt
    video_prior_mode: selected_functional
    video_prior_cpu_offload: false
    video_prior_preservation_freq: 10
    video_prior_preservation_phase: 1
    video_prior_frequency_compensation: true
    strict_video_prior: true
    generated_context_exposure_weight: 0.0
    rollout_training_enable: true
    rollout_training_start_step: 0
    rollout_training_freq: 10
    rollout_training_phase: 2
    rollout_sampling_steps: 8
    rollout_overlap_frames: 4
    rollout_initial_context_frames: 1
    rollout_training_frames: 40
    rollout_num_windows: 3
    rollout_three_window_start_step: 50
    rollout_three_window_probability: 0.25
    rollout_generated_mix_ramp_steps: 100
    rollout_generated_mix_max_prob: 0.25
    rollout_boundary_temporal_weight: 0.0002
    rollout_boundary_color_weight: 5.0e-05
    rollout_boundary_signal_threshold: 0.1
    rollout_boundary_max_grad_ratio: 0.1
    rollout_frequency_compensation: true
    rollout_skip_alignment: true
    strict_rollout_training: true
    diffusion_lr: 2.0e-06
    unit_lr: 1.0e-05
  backbone:
    latent_return_mode: same_level_blocks
    latent_return_stage: down
    latent_return_level: 2
    latent_return_blocks:
    - -1
    world_state:
      enable: true
      dim: 768
      inject_level: 2
      anchor_dim: 9
      memory_grid_size: 4
      max_state_tokens: 160
      visibility_threshold: 0.35
      visibility_temperature: 0.1
  lr_scheduler:
    num_warmup_steps: 20
  lr_scheduler_frequency: 1
  logging:
    grad_norm_freq: 0
    loss_freq: 10
dataset:
  subdataset_size: 10000
  rollout_training_frames: 40
experiment:
  ema:
    enable: false
  training:
    lr: 2.0e-06
    max_epochs: 999
    max_steps: 250
    batch_size: 1
    data:
      num_workers: 0
      shuffle: true
    optim:
      accumulate_grad_batches: ${oc.env:ACCUM,10}
      gradient_clip_val: 1.0
    log_every_n_steps: 10
    checkpointing:
      every_n_train_steps: 50
      every_n_epochs: null
      save_top_k: 1
      save_last: link
  find_unused_parameters: true
  validation:
    limit_batch: 0.0
    num_sanity_val_steps: 0
wandb:
  mode: offline
load: checkpoints/upcast_adapter.ckpt
