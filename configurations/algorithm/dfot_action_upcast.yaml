defaults:
  - dfot_video
  - override backbone: dit3d

lr_scheduler_frequency: 1

backbone:
  latent_return_mode: dit_block
  latent_return_stage: blocks
  latent_return_level: 0
  # Zero-based block 5 is the sixth and central block in DiT-B/12.
  latent_return_blocks: [5]

alignment:
  alignment_mode: unit_world_latent
  unit_arch_version: 7
  unit_bootstrap_steps: 100
  bootstrap_alignment_coeff: 0.05
  alignment_coeff: 0.004
  diffusion_lr: 1.0e-6
  unit_lr: 8.0e-5
  unit_init_checkpoint: checkpoints/upcast_acquired.ckpt
  unit_init_min_fraction: 0.95

  alignment_context_length: 16
  keyframe_stride: 1
  latents_info: [[768, 16, 16]]
  geometry_teacher: page4d
  geometry_teacher_repo_id: zhouk777/PAGE4D
  geometry_teacher_checkpoint: huggingface/zhouk777--PAGE4D/checkpoint_nomask.pt
  geometry_representation: point_map
  geometry_feature_info: [3, 128, 128]
  geometry_normalize: true

  unit_dim: 768
  unit_spatial_grid: [8, 8]
  unit_anchor_grid: [16, 16]
  unit_mformer_layers: 4
  unit_fusion_layers: 4
  unit_appearance_layers: 2
  unit_appearance_fusion_layers: 2
  unit_visual_decoder_layers: 8
  unit_geometry_decoder_layers: 8
  unit_num_heads: 12
  unit_ffn_dim: 3072
  unit_vq_dim: 64
  unit_vq_stages: 2
  unit_vq_codebook_size: 256
  unit_commitment_beta: 0.25
  unit_vq_ema_decay: 0.8
  unit_vq_dead_code_threshold: 2
  unit_vq_dead_code_restart_interval: 100
  unit_geometry_feature_channels: 2048
  unit_noise_signal_threshold: 0.01
  unit_dino_model_name: dinov2_vits14

  # DiT3D has no independently replayable U-ViT suffix. Cross-reconstruction
  # and shared-code distillation remain active; no approximate tail is used.
  unit_tail_fm_loss_weight: 0.0
  unit_joint_tail_fm_loss_weight: 0.0
  unit_video_tail_checkpoint: null
  generation_dino_patch_loss_weight: 0.0
  generation_vjepa_spatial_loss_weight: 0.0
  generation_vjepa_temporal_loss_weight: 0.0
  generation_vjepa_global_loss_weight: 0.0
  generation_pixel_loss_weight: 0.0

_name: dfot_action_upcast
